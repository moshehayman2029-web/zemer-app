name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate persistent debug keystore
        run: |
          keytool -genkey -v \
            -keystore app/persistent-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create stub google-services.json
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "mlh811-music",
              "storage_bucket": "mlh811-music.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1111111111111111",
                  "android_client_info": {
                    "package_name": "com.koshermusic.mlh811music"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "123456789012-dummywebclientid1234567890abcdef.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly1234567890"
                  }
                ]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:2222222222222222",
                  "android_client_info": {
                    "package_name": "com.jtech.zemer"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "123456789012-dummywebclientid1234567890abcdef.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly1234567890"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLH811-music-debug
          path: app/build/outputs/apk/debug/app-debug.apk
